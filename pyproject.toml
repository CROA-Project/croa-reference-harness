[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "croa-reference-harness"
dynamic = ["version"]
description = "CROA Minimal Reference Harness — a vendor-neutral demonstrator of CROA enforcement (stdlib only)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/CROA-Project/croa-reference-harness"
Repository = "https://github.com/CROA-Project/croa-reference-harness.git"
"Issue Tracker" = "https://github.com/CROA-Project/croa-reference-harness/issues"

[tool.setuptools.dynamic]
version = {attr = "mrh.__version__"}

[tool.setuptools.packages.find]
include = ["mrh", "mrh.*"]
exclude = ["tests*", "private_*"]